<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="اللامع — AL LAMEA">
  <defs>
    <!-- تدرج ذهبي: أفتح فوق، أعمق تحت -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5DCA0"/>
      <stop offset=".25" stop-color="#E5C078"/>
      <stop offset=".55" stop-color="#C9A058"/>
      <stop offset=".8" stop-color="#A48538"/>
      <stop offset="1" stop-color="#7E6324"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A7A2E"/>
      <stop offset=".5" stop-color="#F5DCA0"/>
      <stop offset="1" stop-color="#9A7A2E"/>
    </linearGradient>
    <!-- جلد أسود محبب (نقاط) -->
    <radialGradient id="leather" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#221810"/>
      <stop offset=".5" stop-color="#161008"/>
      <stop offset="1" stop-color="#080502"/>
    </radialGradient>
    <!-- نقش جلد محبب بنقاط (grain) -->
    <pattern id="grain" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="url(#leather)"/>
      <circle cx="1" cy="1" r=".4" fill="#3A2A14" opacity=".7"/>
      <circle cx="4" cy="2" r=".3" fill="#2A1F12" opacity=".6"/>
      <circle cx="2" cy="4" r=".35" fill="#3A2A14" opacity=".55"/>
      <circle cx="5" cy="5" r=".3" fill="#2A1F12" opacity=".5"/>
      <circle cx="3" cy="3" r=".25" fill="#1A1308" opacity=".4"/>
    </pattern>
    <!-- نقش ماسي لللام (ذهبي كثيف) -->
    <pattern id="diamond" x="0" y="0" width="30" height="44" patternUnits="userSpaceOnUse">
      <rect width="30" height="44" fill="url(#grain)"/>
      <g transform="translate(15 22)">
        <path d="M-8 -12 L8 -12 L8 12 L-8 12 Z" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity=".95"/>
        <path d="M-4 -6 L4 -6 L4 6 L-4 6 Z" fill="none" stroke="url(#gold)" stroke-width=".7" opacity=".8"/>
        <circle r="1.2" fill="url(#gold)"/>
      </g>
    </pattern>
    <!-- نمط محبوك أفقي متموج (للألف) -->
    <pattern id="wave" x="0" y="0" width="22" height="14" patternUnits="userSpaceOnUse">
      <rect width="22" height="14" fill="url(#grain)"/>
      <path d="M0 4 Q5.5 0 11 4 Q16.5 8 22 4" stroke="url(#gold)" stroke-width="1.1" fill="none" opacity=".85"/>
      <path d="M0 10 Q5.5 14 11 10 Q16.5 6 22 10" stroke="url(#gold)" stroke-width="1.1" fill="none" opacity=".85"/>
    </pattern>
    <!-- نقش تظليل خفيف على حرف العين (3 فتحات) -->
    <linearGradient id="darkGrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1208"/>
      <stop offset="1" stop-color="#080502"/>
    </linearGradient>
    <!-- توهج خلفي للإطار -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══ خلفية سوداء ═══ -->
  <rect width="1024" height="1024" fill="#0A0604"/>
  <!-- تدرج لوني خفيف في المنتصف لإحساس العمق -->
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
    <stop offset="0" stop-color="#1A1208" stop-opacity=".5"/>
    <stop offset="1" stop-color="#0A0604" stop-opacity="0"/>
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- ═══ الشعار من اليسار لليمين: ع - م - ل - ا ═══ -->
  <g transform="translate(512 512)">

    <!-- ════════════ حرف العين (اليسار، رقم 4) ════════════ -->
    <g transform="translate(-340 0)">
      <!-- الإطار الذهبي الخارجي: شكل العين مع ذيل سفلي -->
      <path d="M -95 -310 L 95 -310 L 95 -100 L 55 -50 L 95 20 L 95 250 L 65 270 L 30 280 L 0 290 L -25 305 L -50 310 Q -90 320 -125 305 L -120 285 Q -90 290 -50 280 L -25 265 L 0 250 L 25 235 L -55 195 L -55 175 L -95 130 L -95 50 L -55 0 L -95 -50 Z"
            fill="url(#gold)" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>
      <!-- تعبئة بجلد محبب -->
      <path d="M -82 -295 L 82 -295 L 82 -100 L 50 -50 L 82 10 L 82 240 L 60 258 L 28 268 L 0 278 L -22 292 L -45 296 Q -78 300 -100 290 L -82 270 L -50 268 L -28 256 L -8 245 L 12 235 L -45 195 L -45 175 L -82 130 L -82 50 L -50 0 L -82 -50 Z"
            fill="url(#grain)"/>
      <!-- إطار داخلي رقيق -->
      <path d="M -82 -295 L 82 -295 L 82 -100 L 50 -50 L 82 10 L 82 240 L 60 258 L 28 268 L 0 278 L -22 292 L -45 296 Q -78 300 -100 290"
            fill="none" stroke="url(#gold)" stroke-width="1" opacity=".5"/>
      <!-- الفتحات الداخلية لحرف العين (3 فتحات منقطة) -->
      <ellipse cx="-25" cy="-80" rx="14" ry="9" fill="url(#gold)" opacity=".3"/>
      <ellipse cx="25" cy="-80" rx="14" ry="9" fill="url(#gold)" opacity=".3"/>
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#gold)" opacity=".25"/>
      <ellipse cx="0" cy="80" rx="14" ry="9" fill="url(#gold)" opacity=".3"/>
      <ellipse cx="-25" cy="160" rx="12" ry="8" fill="url(#gold)" opacity=".25"/>
      <ellipse cx="25" cy="160" rx="12" ry="8" fill="url(#gold)" opacity=".25"/>
      <!-- خط فاصل وسط العمود -->
      <line x1="0" y1="-290" x2="0" y2="270" stroke="url(#goldSoft)" stroke-width="1" opacity=".3"/>
    </g>

    <!-- ════════════ حرف الميم (وسط-يسار، رقم 3) ════════════ -->
    <g transform="translate(-100 0)">
      <!-- الإطار الذهبي: شكل الميم -->
      <path d="M -120 -310 L 120 -310 L 120 100 L 80 150 L 120 200 L 120 270 L -120 270 L -120 200 L -80 150 L -120 100 Z"
            fill="url(#gold)" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>
      <!-- تعبئة بجلد محبب -->
      <path d="M -107 -295 L 107 -295 L 107 95 L 75 150 L 107 200 L 107 252 L -107 252 L -107 200 L -75 150 L -107 95 Z"
            fill="url(#grain)"/>
      <!-- إطار داخلي رقيق -->
      <path d="M -107 -295 L 107 -295 L 107 95 L 75 150 L 107 200 L 107 252 L -107 252 L -107 200 L -75 150 L -107 95 Z"
            fill="none" stroke="url(#gold)" stroke-width="1" opacity=".5"/>
      <!-- فتحة وسطى في الميم (تشبه العين) -->
      <ellipse cx="0" cy="-80" rx="20" ry="14" fill="url(#gold)" opacity=".3"/>
      <ellipse cx="0" cy="0" rx="22" ry="16" fill="url(#gold)" opacity=".25"/>
      <ellipse cx="0" cy="80" rx="20" ry="14" fill="url(#gold)" opacity=".3"/>
      <!-- نتوء صغير (شكل قوس/دال) في الميم -->
      <path d="M -75 150 Q -95 130 -75 110 Q -55 130 -75 150 Z" fill="url(#gold)"/>
      <circle cx="-75" cy="135" r="5" fill="url(#grain)" stroke="url(#gold)" stroke-width="1"/>
      <!-- ذيل سفلي منحني للميم -->
      <path d="M 0 252 Q 30 280 60 270 L 55 285 Q 25 295 0 290 Q -25 295 -55 285 L -60 270 Q -30 280 0 252 Z" fill="url(#gold)"/>
      <path d="M 0 260 Q 25 280 50 270 L 48 278 Q 25 285 0 282 Q -25 285 -48 278 L -50 270 Q -25 280 0 260 Z" fill="url(#grain)"/>
    </g>

    <!-- ════════════ حرف اللام (وسط-يمين، رقم 2) ════════════ -->
    <g transform="translate(135 0)">
      <!-- الإطار الذهبي: حرف اللام مع ذيل سفلي -->
      <path d="M -90 -310 L 90 -310 L 90 100 L 50 160 L 90 220 Q 110 280 60 320 L -30 305 Q -82 280 -90 230 L -90 100 L -52 50 L -90 0 Z"
            fill="url(#gold)" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>
      <!-- تعبئة بالنقش الماسي (ذهبي) -->
      <path d="M -77 -296 L 77 -296 L 77 95 L 45 158 L 77 215 Q 96 270 55 305 L -25 290 Q -70 270 -77 222 L -77 95 L -47 50 L -77 0 Z"
            fill="url(#diamond)"/>
      <!-- إطار داخلي رقيق -->
      <path d="M -77 -296 L 77 -296 L 77 95 L 45 158 L 77 215 Q 96 270 55 305 L -25 290 Q -70 270 -77 222 L -77 95 L -47 50 L -77 0 Z"
            fill="none" stroke="url(#gold)" stroke-width="1" opacity=".7"/>
      <!-- خط فاصل عمودي في منتصف اللام -->
      <line x1="0" y1="-296" x2="0" y2="285" stroke="url(#goldSoft)" stroke-width="1" opacity=".5"/>
    </g>

    <!-- ════════════ حرف الألف (اليمين، رقم 1) ════════════ -->
    <g transform="translate(335 0)">
      <!-- الإطار الذهبي: أعرض قليلاً مع حواف مدورة -->
      <path d="M -65 -350 L 65 -350 L 90 -305 L 90 305 L 65 350 L -65 350 L -90 305 L -90 -305 Z"
            fill="url(#gold)" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>
      <!-- تعبئة بنمط الموجات -->
      <path d="M -52 -335 L 52 -335 L 76 -302 L 76 302 L 52 335 L -52 335 L -76 302 L -76 -302 Z"
            fill="url(#wave)"/>
      <!-- إطار داخلي رقيق -->
      <path d="M -52 -335 L 52 -335 L 76 -302 L 76 302 L 52 335 L -52 335 L -76 302 L -76 -302 Z"
            fill="none" stroke="url(#gold)" stroke-width="1" opacity=".7"/>
      <!-- خط فاصل عمودي في منتصف الألف -->
      <line x1="0" y1="-330" x2="0" y2="330" stroke="url(#goldSoft)" stroke-width="1" opacity=".5"/>
      <!-- زخرفة علوية (نجمة في قمة الألف) -->
      <g transform="translate(0 -350)">
        <rect x="-25" y="-14" width="50" height="28" fill="url(#gold)"/>
        <rect x="-18" y="-7" width="36" height="14" fill="url(#grain)"/>
        <g transform="rotate(45)">
          <rect x="-5" y="-5" width="10" height="10" fill="url(#gold)"/>
        </g>
      </g>
      <!-- قاعدة سفلية عريضة -->
      <rect x="-35" y="350" width="70" height="16" fill="url(#gold)"/>
      <rect x="-26" y="350" width="52" height="7" fill="url(#grain)" opacity=".5"/>
    </g>

  </g>
</svg>
