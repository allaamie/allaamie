<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="اللامع — AL LAMEA">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9BF74"/>
      <stop offset=".55" stop-color="#B89146"/>
      <stop offset="1" stop-color="#8A6A2E"/>
    </linearGradient>
  </defs>
  <!-- شكل المعين المميز (شعار الدارة) -->
  <g transform="translate(120 120)">
    <!-- المعين الخارجي -->
    <path d="M0 -95 L78 -22 L46 60 L-46 60 L-78 -22 Z"
          fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linejoin="miter"/>
    <!-- المعين الداخلي -->
    <path d="M0 -62 L52 -16 L32 42 L-32 42 L-52 -16 Z"
          fill="none" stroke="url(#g)" stroke-width="2" opacity=".75" stroke-linejoin="miter"/>
    <!-- نقطة المركز -->
    <circle r="6" fill="url(#g)"/>
    <!-- خط ذهبي علوي -->
    <line x1="-90" y1="0" x2="-66" y2="0" stroke="url(#g)" stroke-width="3"/>
    <line x1="66"  y1="0" x2="90"  y2="0" stroke="url(#g)" stroke-width="3"/>
  </g>
  <!-- كلمة اللامع -->
  <text x="120" y="220" text-anchor="middle"
        font-family="Amiri, 'Reem Kufi', 'IBM Plex Sans Arabic', serif"
        font-size="20" font-weight="700" fill="#B89146"
        direction="rtl" unicode-bidi="bidi-override">اللامع</text>
</svg>
