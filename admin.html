<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة أصالة اليمن</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Reem+Kufi:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><main id="auth" class="auth"><div class="auth-card"><a class="logo" href="index.html">أصالة <b>اليمن</b></a><p>لوحة إدارة المتجر</p><h1>أهلاً بعودتك</h1><form id="login"><label>البريد الإلكتروني<input type="email" name="email" required placeholder="name@example.com"></label><label>كلمة المرور<input type="password" name="password" required placeholder="••••••••"></label><button>تسجيل الدخول</button><small id="auth-msg"></small></form></div></main><main id="app" hidden><aside><a class="logo" href="index.html">أصالة <b>اليمن</b></a><p class="role" id="role">—</p><nav><button class="active" data-page="dashboard">◫ نظرة عامة</button><button data-page="products">▣ المنتجات</button><button data-page="orders">▤ الطلبات</button><button data-page="team">♙ الفريق</button></nav><button id="signout" class="signout">تسجيل الخروج ←</button></aside><section class="content"><header><div><p id="today"></p><h1 id="page-title">نظرة عامة</h1></div><a href="index.html" target="_blank">عرض المتجر ↗</a></header><div id="view"></div></section></main><dialog id="product-dialog"><form method="dialog" id="product-form"><div class="modal-head"><h2 id="modal-title">منتج جديد</h2><button value="cancel">×</button></div><input type="hidden" name="id"><div class="form-grid"><label>اسم المنتج<input name="name" required></label><label>الرابط المختصر<input name="slug" required placeholder="thobe-sanaani"></label><label>السعر (ر.س)<input name="price" type="number" min="0" required></label><label>سعر التخفيض<input name="sale_price" type="number" min="0"></label><label>المخزون<input name="stock" type="number" min="0" required></label><label>التصنيف<select name="category_id" id="product-category"></select></label><label>رابط الصورة<input name="image_url" type="url" placeholder="https://..."></label><label>المقاسات (مثال S,M,L)<input name="sizes"></label></div><label>الوصف<textarea name="description"></textarea></label><label class="check"><input name="is_active" type="checkbox" checked> ظاهر في المتجر</label><button class="save">حفظ المنتج</button></form></dialog><script type="module" src="admin.js"></script></body></html>
