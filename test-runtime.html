<!doctype html>
<html><head><meta charset="utf-8"><title>Runtime Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="error-tracker.js"></script>
<script src="analytics.js"></script>
<script src="catalog.js"></script>
<script src="pwa.js"></script>
<script src="studio.js"></script>
</head><body>
<div id="loader"><img src="assets/allamea-logo.png" alt="اللامع"></div>
<div class="studio">
  <header class="topbar">
    <a class="back" href="index.html"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>العودة</a>
    <div class="mark"><img src="assets/allamea-logo.png" alt="اللامع"><b>الاستوديو<small>AL LAMEA</small></b></div>
    <button class="cart-pill" id="cart-pill"><svg viewBox="0 0 24 24"></svg>السلة <b id="cart-count">0</b></button>
  </header>
  <section class="arena">
    <aside class="rail rail-l">
      <button class="tool" id="tool-save"><svg></svg><small>حفظ</small></button>
      <button class="tool" id="tool-looks"><svg></svg><small>إطلالاتي</small></button>
      <button class="tool" id="tool-shot"><svg></svg><small>التقاط</small></button>
      <button class="tool" id="tool-share"><svg></svg><small>مشاركة</small></button>
      <button class="tool" id="tool-cart"><svg></svg><small>أضف</small></button>
      <button class="tool" id="tool-fav"><svg></svg><small>المفضلة</small></button>
    </aside>
    <div class="stage" id="stage" data-bg="black">
      <div class="stage-atmo"></div>
      <div id="stage-zoom"><div id="stage-rot">
        <div class="avatar-box" id="avatar-box">
          <div class="pedestal"><span class="ped-ring" id="ped-ring"></span></div>
          <div id="avatar-holder"></div>
          <div id="wear-layers"></div>
        </div>
      </div></div>
      <div class="zoom-fab">
        <button id="zoom-in">+</button><button id="zoom-out">−</button><button id="zoom-reset">⌂</button>
      </div>
      <div class="look-total" id="look-total"><span>إجمالي</span><b class="num">0 ر.س</b><span id="look-count"></span></div>
      <div class="stage-hint" id="stage-hint"><span>اسحب للتدوير</span></div>
      <div class="advisor" id="advisor">
        <div class="adv-head"><b>المستشار</b><span id="adv-close">×</span></div>
        <p class="adv-text" id="adv-text"></p>
        <div class="adv-list" id="adv-list"></div>
      </div>
    </div>
    <aside class="rail rail-r" id="rail-r">
      <div class="toggle-row"><h5>إعدادات</h5><span id="rail-r-close">×</span></div>
      <div><h5>الشخصية</h5><div class="character-grid" id="character-grid"></div></div>
      <div class="divider"></div>
      <div><h5>تخصيص</h5><div id="customizer"></div></div>
      <div class="divider"></div>
      <div><h5>أجواء</h5><div class="dots bg-dots" id="bg-dots"></div></div>
      <div class="toggle-row"><span>دوران</span><button class="switch" id="auto-rotate"><i></i></button></div>
      <button class="ghost-btn" id="reset-all">إعادة</button>
      <button class="ghost-btn" id="strip-all">خلع</button>
      <div class="divider"></div>
      <button class="ghost-btn" id="adv-open">✦ اسأل</button>
    </aside>
  </section>
  <section class="catalog">
    <nav class="tabs" id="tabs"></nav>
    <div class="cat-scroll" id="cat-scroll"></div>
  </section>
</div>
<aside class="looks" id="looks">
  <header><b>إطلالاتي</b><span id="looks-close">×</span></header>
  <div class="looks-body" id="looks-body"></div>
</aside>
<div class="save-look-dialog" id="save-look-dialog">
  <div class="save-look-card">
    <b>حفظ</b><input id="look-name"><div class="look-sugg" id="look-sugg"></div>
    <div class="save-look-actions">
      <button class="ghost-btn" id="save-look-cancel">إلغاء</button>
      <button class="gold-btn" id="save-look-ok">حفظ</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="out" style="position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font:11px monospace;padding:8px;z-index:99999;max-height:200px;overflow:auto;white-space:pre-wrap"></div>
<script>
const out = document.getElementById('out');
const log = (...a) => out.textContent += a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' ') + '\n';
window.onerror = (m, s, l, c, e) => { log('ERROR:', m, '@', s + ':' + l, '\n', e?.stack || ''); };
window.addEventListener('unhandledrejection', e => log('PROMISE:', e.reason?.message || e.reason));
addEventListener('DOMContentLoaded', () => log('DOM ready · catalog items:', window.ALLAMEA_CATALOG?.length));
setTimeout(() => log('3s check · state.products:', state.products?.length, '· avatar rendered:', !!document.querySelector('#avatar-holder svg')), 3000);
</script>
</body></html>
